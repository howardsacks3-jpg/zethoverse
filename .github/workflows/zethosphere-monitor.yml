name: ZETHOSPHERE read-only monitoring
on:
  push:
    branches: [feature/zethosphere-live-monitoring]
    paths-ignore:
      - 'monitor-data/**'
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Send a real email delivery test (requires configured Resend credentials)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: zethosphere-monitor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Pin both jobs to the exact event commit. Do not silently check out
          # a newer branch tip while testing or generating status.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit and safety tests
        run: node --test test/*.test.cjs test/*.test.mjs
      - name: Send real email delivery test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_email }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
        run: node scripts/test-alert-email.cjs
  monitor:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Generate status from the same immutable commit that passed tests.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run read-only monitor
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          ZETHO_MINT_ADDRESS: ${{ vars.ZETHO_MINT_ADDRESS }}
          ZETHO_MONITOR_ADDRESSES: ${{ vars.ZETHO_MONITOR_ADDRESSES }}
          ZETHO_PROGRAM_ADDRESSES: ${{ vars.ZETHO_PROGRAM_ADDRESSES }}
          ZETHO_LARGE_TRANSFER_THRESHOLD: ${{ vars.ZETHO_LARGE_TRANSFER_THRESHOLD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          ZETHO_EMAIL_DELIVERY_VERIFIED: ${{ vars.ZETHO_EMAIL_DELIVERY_VERIFIED }}
        run: node scripts/zethosphere-monitor.cjs
      - name: Publish status and event history without overwriting newer commits
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor-data/status.json monitor-data/events.json
          if git diff --cached --quiet; then
            echo "Monitoring data unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "chore: update ZETHOSPHERE monitoring data"

          # The branch may advance while the monitor is running. Rebase the
          # generated commit onto the latest tip. If both runs changed the JSON
          # data, merge event history and retain the status/cursors from the
          # newest generatedAt timestamp. Never force-push.
          for attempt in 1 2 3 4 5; do
            echo "Publishing attempt ${attempt}/5 to ${TARGET_BRANCH}"
            git fetch origin "${TARGET_BRANCH}"
            if ! git rebase "origin/${TARGET_BRANCH}"; then
              conflicted="$(git diff --name-only --diff-filter=U)"
              unexpected="$(printf '%s\n' "${conflicted}" | grep -vE '^(monitor-data/status.json|monitor-data/events.json)$' || true)"
              if [ -n "${unexpected}" ]; then
                echo "Unexpected source conflict; aborting safely:" >&2
                echo "${unexpected}" >&2
                git rebase --abort
                exit 1
              fi

              git show HEAD:monitor-data/status.json > /tmp/zetho-status-remote.json
              git show REBASE_HEAD:monitor-data/status.json > /tmp/zetho-status-local.json
              git show HEAD:monitor-data/events.json > /tmp/zetho-events-remote.json
              git show REBASE_HEAD:monitor-data/events.json > /tmp/zetho-events-local.json
              node <<'NODE'
          const fs = require('node:fs');
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const remoteStatus = read('/tmp/zetho-status-remote.json');
          const localStatus = read('/tmp/zetho-status-local.json');
          const localNewer = Date.parse(localStatus.generatedAt || 0) >= Date.parse(remoteStatus.generatedAt || 0);
          const status = localNewer ? localStatus : remoteStatus;
          const remoteState = read('/tmp/zetho-events-remote.json');
          const localState = read('/tmp/zetho-events-local.json');
          const byId = new Map();
          for (const event of [...(remoteState.events || []), ...(localState.events || [])]) {
            const key = event.fingerprint || [event.signature || '', event.type || '', event.address || '', event.message || ''].join('|');
            const previous = byId.get(key) || {};
            byId.set(key, {
              ...previous,
              ...event,
              alertedAt: previous.alertedAt || event.alertedAt,
              deliveryId: previous.deliveryId || event.deliveryId,
              acknowledged: previous.acknowledged || event.acknowledged
            });
          }
          const events = [...byId.values()]
            .sort((a, b) => String(b.firstSeenAt || '').localeCompare(String(a.firstSeenAt || '')))
            .slice(0, 1000);
          const state = {
            events,
            cursors: (localNewer ? localState : remoteState).cursors || {}
          };
          status.events = events.slice(0, 100);
          status.pendingAlerts = events.filter(e => e.deliveryPending && !e.alertedAt).length;
          fs.writeFileSync('monitor-data/status.json', JSON.stringify(status, null, 2) + '\n');
          fs.writeFileSync('monitor-data/events.json', JSON.stringify(state, null, 2) + '\n');
          NODE
              git add monitor-data/status.json monitor-data/events.json
              GIT_EDITOR=true git rebase --continue
            fi

            if git push origin "HEAD:refs/heads/${TARGET_BRANCH}"; then
              echo "Monitoring status published."
              exit 0
            fi
            if [ "${attempt}" -lt 5 ]; then
              sleep $((attempt * 2))
            fi
          done

          echo "Unable to publish after five safe retries; no force-push was attempted." >&2
          exit 1
