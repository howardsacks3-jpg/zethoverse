<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZETHOSPHERE Founder Access</title>
<style>body{margin:0;background:#080d1b;color:#eef1f8;font:16px/1.6 Arial;display:grid;place-items:center;min-height:100vh}.panel{width:min(440px,calc(100% - 36px));background:#10182a;border:1px solid #28344d;border-radius:14px;padding:26px}h1{color:#e4c477}label{display:block;margin:16px 0 6px}input,button{width:100%;padding:12px;border-radius:7px;box-sizing:border-box}input{background:#080d1b;color:white;border:1px solid #52617d}button{margin-top:16px;background:#e4c477;border:0;font-weight:bold;cursor:pointer}.muted{color:#a1abc0;font-size:13px}#message{min-height:24px}</style></head>
<body><main class="panel"><h1>Founder access</h1><p class="muted">Password-only access. The password is sent only to the configured authentication worker over HTTPS. Never enter a wallet recovery phrase or private key.</p>
<form id="login"><label for="password">Founder password</label><input id="password" type="password" autocomplete="current-password" minlength="20" required><button type="submit">Sign in</button></form>
<button id="logout" hidden>Sign out</button><p id="message" role="status" aria-live="polite"></p><pre id="monitor-status" class="muted" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre><p class="muted">Authentication service must be deployed and configured before access is enabled.</p><p><a href="zethosphere.html" style="color:#e4c477">Return to public dashboard</a></p></main>
<script>
const API='/api/founder';const statusView=document.getElementById('monitor-status');const form=document.getElementById('login'),logout=document.getElementById('logout'),msg=document.getElementById('message'),input=document.getElementById('password');
async function refresh(){try{const r=await fetch(API+'/session',{credentials:'same-origin',cache:'no-store'});const d=await r.json();form.hidden=!!d.authenticated;logout.hidden=!d.authenticated;msg.textContent=d.authenticated?'Authenticated. Session verified.':'Not signed in.';if(d.authenticated){const sr=await fetch(API+'/monitor-status',{credentials:'same-origin',cache:'no-store'});const sd=await sr.json();statusView.textContent=sr.ok?JSON.stringify(sd,null,2):(sd.error||'Founder status unavailable.');}else statusView.textContent='';}catch{msg.textContent='Authentication service unavailable.';}}
form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Signing in…';try{const r=await fetch(API+'/login',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({password:input.value})});const d=await r.json();input.value='';if(!r.ok)throw Error(d.error||'Login failed');await refresh();}catch(err){msg.textContent=err.message;}});
logout.addEventListener('click',async()=>{await fetch(API+'/logout',{method:'POST',credentials:'same-origin'});await refresh();});
refresh();
</script></body></html>
